    .not-found {
      min-height: 100dvh;

    .not-found-bg {

    }
    .not-found-orb {
      position: absolute;
      width: 600px; height: 600px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45,99,216,0.15) 0%, transparent 70%);
      filter: blur(80px);
    }
    .not-found-inner {
      position: relative;
      z-index: 1;
      max-width: 540px;
    }
    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      color: transparent;
      background: linear-gradient(135deg, var(--gold) 0%, rgba(45,99,216,0.4) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      margin-bottom: 24px;
      font-variant-numeric: tabular-nums;
    }
    .not-found-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 16px;
      text-wrap: balance;
    }
    .not-found-body {
      color: var(--text-2);
      line-height: 1.7;
      margin-bottom: 40px;
      font-size: 1rem;
      text-wrap: balance;
    }
    .not-found-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .not-found-divider {
      width: 40px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 28px;
      border-radius: 2px;
