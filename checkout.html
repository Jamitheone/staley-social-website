<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Start your Staley OS plan. One quick step, then secure checkout." data-es-content="Empieza tu plan de Staley OS. Un paso rápido y luego el pago seguro.">
  <title data-es="Empieza tu plan | The Staley Social">Start your plan | The Staley Social</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/logos/favicon.png" type="image/png">
  <meta name="theme-color" content="#090910">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GB8CM3TL22"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GB8CM3TL22');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=16">
  <link rel="stylesheet" href="css/flat.css?v=3">
  <style>
    .co-wrap { min-height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .co-card { max-width: 460px; width: 100%; }
    .co-logo { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 700; margin-bottom: 36px; }
    .co-logo .nav-logo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); display: inline-block; }
    .co-eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #7aa2ff; margin-bottom: 10px; }
    .co-plan { margin-top: 0; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; color: var(--text); line-height: 1.1; margin-bottom: 4px; }
    .co-price { font-size: 1rem; color: var(--text-2); margin-bottom: 6px; }
    .co-note { font-size: 0.85rem; color: #9a9ab8; margin-bottom: 28px; }
    .co-field { margin-bottom: 16px; }
    .co-field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    .co-field input { width: 100%; padding: 13px 14px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-2, rgba(255,255,255,0.03)); color: var(--text); font-family: var(--font-body); font-size: 1rem; }
    .co-field input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-color: var(--blue); }
    .co-hp { position: absolute; left: -9999px; }
    .co-btn { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 24px; border: 0; border-radius: 3px; background: var(--blue); color: #fff; font-family: var(--font-body); font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; margin-top: 6px; }
    .co-btn:hover { background: #2556c4; }
    .co-btn[disabled] { opacity: 0.6; cursor: default; }
    .co-secure { text-align: center; font-size: 0.78rem; color: #9a9ab8; margin-top: 16px; }
    .co-err { color: #ff8a8a; font-size: 0.85rem; margin-top: 12px; min-height: 1em; }
  
    .lang-corner { position: absolute; top: 12px; right: 16px; z-index: 5; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body class="page-flat">
  <div class="lang lang-corner" role="group" aria-label="Language" data-es-aria-label="Idioma">
    <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
    <button type="button" data-lang="es" aria-pressed="false" lang="es">ES</button>
    <label class="sr-only" for="more-lang" data-es="Más idiomas">More languages</label>
    <select id="more-lang" translate="no">
      <option value="" data-es="Más">More</option>
      <optgroup label="Machine translated" data-es-label="Traducción automática">
        <option value="pt">Português</option><option value="fr">Français</option>
        <option value="de">Deutsch</option><option value="it">Italiano</option>
        <option value="tl">Tagalog</option><option value="vi">Tiếng Việt</option>
        <option value="zh-CN">中文</option><option value="ja">日本語</option>
        <option value="ko">한국어</option><option value="ar">العربية</option>
        <option value="hi">हिन्दी</option><option value="ru">Русский</option>
      </optgroup>
    </select>
  </div>
  <main class="co-wrap">
    <div class="co-card">
      <a href="/" class="co-logo"><span class="nav-logo-dot" aria-hidden="true"></span>The Staley Social</a>
      <div class="co-eyebrow" data-es="Empieza tu plan">Start your plan</div>
      <h1 class="co-plan" id="co-plan">Staley OS</h1>
      <div class="co-price" id="co-price">$197/mo</div>
      <div class="co-note" data-es="Sin cargo de instalación. Cancela cuando quieras. Un paso rápido y luego el pago seguro.">No setup fee. Cancel anytime. One quick step, then secure checkout.</div>
      <form id="co-form" novalidate>
        <div class="co-field"><label for="co-first" data-es="Nombre">First name</label><input id="co-first" name="firstName" autocomplete="given-name" required></div>
        <div class="co-field"><label for="co-email" data-es="Correo de trabajo">Work email</label><input id="co-email" name="email" type="email" autocomplete="email" required></div>
        <div class="co-field"><label for="co-biz" data-es="Nombre del negocio">Business name</label><input id="co-biz" name="business" autocomplete="organization"></div>
        <input class="co-hp" tabindex="-1" autocomplete="off" name="honey" aria-hidden="true" aria-label="Leave empty" data-es-aria-label="Dejar vacío">
        <button class="co-btn" id="co-btn" type="submit" data-es="Continuar al pago seguro <span style=&quot;font-size:1.1em;&quot;>&rarr;</span>">Continue to secure checkout <span style="font-size:1.1em;">&rarr;</span></button>
        <div class="co-err" id="co-err" role="alert"></div>
      </form>
      <div class="co-secure" data-es="Pago seguro procesado por Square.">Secure payment handled by Square.</div>
    </div>
  </main>

  <script src="checkout-config.js"></script>
  <script>
    (function () {
      var C = window.CheckoutConfig;
      function es() { return document.documentElement.lang === 'es'; }
      var params = new URLSearchParams(location.search);
      var tier = C.pickTier(params.get('tier'));
      var utm = C.sanitizeUtm(params.get('utm_source') || params.get('ref') || '');
      // first-touch: keep the utm from the very first page in this browser if we have one
      try {
        if (utm) localStorage.setItem('tss_first_src', localStorage.getItem('tss_first_src') || utm);
        utm = localStorage.getItem('tss_first_src') || utm;
      } catch (e) {}
      // client referral slug (?ref=), kept apart from campaign utm so the CRM can tag it as a referral
      var ref = C.sanitizeUtm(params.get('ref') || '');
      try {
        if (ref) localStorage.setItem('tss_first_ref', localStorage.getItem('tss_first_ref') || ref);
        ref = localStorage.getItem('tss_first_ref') || ref;
      } catch (e) {}
      document.getElementById('co-plan').textContent = C.TIERS[tier].name;
      var priceEl = document.getElementById('co-price');
      function showPrice() { priceEl.textContent = es() ? C.TIERS[tier].price.replace('/mo', '/mes') : C.TIERS[tier].price; }
      showPrice();
      new MutationObserver(function () { showPrice(); err.textContent = ''; }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
      var square = C.SQUARE[tier];

      var form = document.getElementById('co-form');
      var btn = document.getElementById('co-btn');
      var err = document.getElementById('co-err');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.textContent = '';
        var fd = new FormData(form);
        if (fd.get('honey')) return; // bot
        var firstName = (fd.get('firstName') || '').trim();
        var email = (fd.get('email') || '').trim();
        if (!firstName || !email || email.indexOf('@') < 1) { err.textContent = es() ? 'Agrega tu nombre y un correo válido.' : 'Add your first name and a valid email.'; return; }
        btn.disabled = true; btn.textContent = es() ? 'Un momento...' : 'One sec...';
        gtag('event', 'checkout_start', { tier: tier });
        var payload = { firstName: firstName, email: email, business: (fd.get('business') || '').trim(), tier: tier, utm: utm, ref: ref };
        // Capture the lead, then always hand off to Square (never trap the buyer if CRM hiccups).
        fetch('/api/start-lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
          .catch(function () {})
          .finally(function () { window.location.href = square; });
      });
    })();
  </script>
  <script src="js/main.js?v=9" defer></script>
</body>
</html>
